name: Build/release

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: read

env:
  npm_config_registry: https://registry.npmjs.org
  npm_config_replace_registry_host: registry.npmmirror.com
  # Vendor integrity checks require the exact committed bytes on Windows too.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            app/listen1_chrome_extension/package-lock.json
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release.cjs check-tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - run: npm ci --prefix app/listen1_chrome_extension
      - run: npm test
      - run: npm run lint --prefix app/listen1_chrome_extension
      - run: npm run vendor:check --prefix app/listen1_chrome_extension

  build:
    name: Build (${{ matrix.platform }})
    needs: check
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            script: dist:win
          - os: macos-latest
            platform: mac
            script: dist:mac
          - os: ubuntu-latest
            platform: linux
            script: dist:linux
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            app/listen1_chrome_extension/package-lock.json
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - name: Build without publishing
        run: npm run ${{ matrix.script }}
      - name: Collect installers and update metadata
        run: node scripts/release.cjs collect ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: listen1-${{ matrix.platform }}
          path: dist/release-artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  draft-release:
    name: Create draft release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: listen1-*
          path: dist/release-downloads
          merge-multiple: false
          digest-mismatch: error
      - name: Create or refresh draft assets
        run: node scripts/release.cjs publish dist/release-downloads
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
