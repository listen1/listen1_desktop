name: Build/release

on: push

jobs:
  release:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            app/listen1_chrome_extension/package-lock.json
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - run: npm ci --prefix app/listen1_chrome_extension
      - run: npm test
      - run: npm run lint --prefix app/listen1_chrome_extension
      - run: npm run vendor:check --prefix app/listen1_chrome_extension
      - name: Build without publishing
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx --no-install electron-builder --publish never
      - name: Build and publish version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx --no-install electron-builder --publish onTag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
