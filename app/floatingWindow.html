<!DOCTYPE html>
<!--
文件职责：显示独立的悬浮歌词、翻译和控制工具栏；通过 window.api 接收文本并转发拖动与窗口控制。

文件级定义：
- currentLyric：显示当前原文歌词的 DOM 节点，通过 textContent 更新。
- currentLyricTrans：显示当前译文歌词的 DOM 节点，通过 textContent 更新。
- IS_WINDOW_LOCKED：悬浮歌词的锁定状态，决定鼠标穿透与拖动。
- renderToolBar：依据锁定状态更新工具栏图标及鼠标交互提示。
- animationId：待执行拖动动画帧的标识，用于结束拖动时取消。
- isDragging：是否正在执行自定义窗口拖动。
- mouseX：鼠标按下时距窗口左侧的偏移，单位为像素。
- mouseY：鼠标按下时距窗口顶部的偏移，单位为像素。
- onMouseDown：按下鼠标时记录指针在窗口内的偏移，启动逐帧拖动。
- onMouseUp：结束拖动并取消尚未执行的动画帧。
- moveWindow：逐帧向主进程发送指针偏移，由主进程计算屏幕坐标并约束在工作区内。
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link href="listen1_chrome_extension/css/icon.css" rel="stylesheet" />
    <title>Listen1</title>
    <style>
      div.content {
        border-radius: 5px;
        min-height: 70px;
        box-sizing: border-box;
        overflow: hidden;
        text-align: center;
        font-size: 24px;
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        user-select: none;
        transition: background ease-in-out 0.1s;
      }

      /* 停用样式，保留供历史对照：
span.contentTrans {
        font-size: 18px;
      }
      body.unlocked-body:hover .content {
        background: rgba(36, 36, 36, 0.8);
      } */
      body {
        font-family: "SF Pro Text", "SF Pro Icons", "Helvetica Neue",
          "Microsoft Yahei", "Helvetica", "Arial", sans-serif;
        overflow: hidden;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      .feather {
        height: 16px;
        width: 16px;
        fill: none;
        stroke: #999999;
        display: inline-block;
        background-color: rgba(255,255,255,0.01);
      }
      #toolbar {
        user-select: none;
        position: fixed;
        top: 3px;
        z-index: 9999;
        margin: 0 auto;
        left: 0;
        right: 0;
        text-align: center;
      }
      .icon:hover,
      .icon:hover .feather {
        stroke: #ffffff;
      }
      .group-first-icon {
        margin-left: 10px;
      }
      #currentLyricAll {
        width: 100%;
        height: 100%;
        padding: 8px 24px;
        cursor: move;
      }
      #currentLyricAll span {
        display: block;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <div
      style="visibility: hidden; position: absolute; width: 0px; height: 0px"
    >
      <!-- 加载 Feather SVG 图标集合。 -->
      <svg xmlns="http://www.w3.org/2000/svg">
        <defs>
          <symbol id="x" viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </symbol>
          <symbol id="lock" viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </symbol>
          <symbol id="unlock" viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
          </symbol>
          <symbol id="type" viewBox="0 0 24 24">
            <polyline points="4 7 4 4 20 4 20 7"></polyline>
            <line x1="9" y1="20" x2="15" y2="20"></line>
            <line x1="12" y1="4" x2="12" y2="20"></line>
          </symbol>
          <symbol id="plus" viewBox="0 0 24 24">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </symbol>
          <symbol id="minus" viewBox="0 0 24 24">
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </symbol>
          <symbol id="sun" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </symbol>
          <symbol id="aperture" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="14.31" y1="8" x2="20.05" y2="17.94"></line>
            <line x1="9.69" y1="8" x2="21.17" y2="8"></line>
            <line x1="7.38" y1="12" x2="13.12" y2="2.06"></line>
            <line x1="9.69" y1="16" x2="3.95" y2="6.06"></line>
            <line x1="14.31" y1="16" x2="2.83" y2="16"></line>
            <line x1="16.62" y1="12" x2="10.88" y2="21.94"></line>
          </symbol>
        </defs>
      </svg>
    </div>
    <div id="currentLyricAll" class="content lyric-content">
      <span id="currentLyric" class="contentOriginal">Listen1</span>
      <span id="currentLyricTrans" class="contentTrans"></span>
    </div>
    <div id="toolbar">
      <div class="locked">
        <svg class="feather icon window-action" id="lock-icon">
          <use href="#lock"></use>
        </svg>
      </div>
      <div class="unlocked">
        <svg
          class="feather icon control-action"
          id="close-icon"
          data-msg="float_window_close"
        >
          <use href="#x"></use>
        </svg>
        <svg class="feather icon window-action" id="unlock-icon">
          <use href="#unlock"></use>
        </svg>
        <a
          class="icon control-action group-first-icon"
          id="font-small-icon"
          data-msg="float_window_font_small"
        >
          <svg class="feather">
            <use href="#type"></use>
          </svg>
          <svg class="feather" style="margin-left: -10px">
            <use href="#minus"></use>
          </svg>
        </a>
        <a
          class="icon control-action"
          id="font-large-icon"
          data-msg="float_window_font_large"
        >
          <svg class="feather">
            <use href="#type"></use>
          </svg>
          <svg class="feather icon" style="margin-left: -10px">
            <use href="#plus"></use>
          </svg>
        </a>
        <a
          class="icon control-action group-first-icon"
          data-msg="float_window_background_dark"
        >
          <svg class="feather">
            <use href="#sun"></use>
          </svg>
          <svg class="feather icon" style="margin-left: -10px">
            <use href="#minus"></use>
          </svg>
        </a>
        <a class="icon control-action" data-msg="float_window_background_light">
          <svg class="feather">
            <use href="#sun"></use>
          </svg>
          <svg class="feather icon" style="margin-left: -10px">
            <use href="#plus"></use>
          </svg>
        </a>
        <a
          class="icon control-action group-first-icon"
          id="font-large-icon"
          data-msg="float_window_font_change_color"
        >
          <svg class="feather">
            <use href="#aperture"></use>
          </svg>
        </a>
      </div>
    </div>
    <script>
      /**
       * currentLyric：显示当前原文歌词的 DOM 节点，通过 textContent 更新；类型为 HTMLElement|null。
       * @type {HTMLElement|null}
       */
      const currentLyric = document.getElementById("currentLyric");
      window.api.onLyric(
        /**
         * 进入此回调后，更新 currentLyric.textContent。
         * @param arg 从桌面桥收到的当前原文歌词文本。
         * @returns {void} 无返回值。
         */
        (arg) => {
        currentLyric.textContent = arg;
      });
      /**
       * currentLyricTrans：显示当前译文歌词的 DOM 节点，通过 textContent 更新；类型为 HTMLElement|null。
       * @type {HTMLElement|null}
       */
      const currentLyricTrans = document.getElementById("currentLyricTrans");
      window.api.onTranslLyric(
        /**
         * 进入此回调后，更新 currentLyricTrans.textContent。
         * @param arg 从桌面桥收到的当前译文歌词文本。
         * @returns {void} 无返回值。
         */
        (arg) => {
        currentLyricTrans.textContent = arg;
      });
    </script>
    <script>
      /**
       * IS_WINDOW_LOCKED：悬浮歌词的锁定状态，决定鼠标穿透与拖动；类型为 boolean。
       * @type {boolean}
       */
      let IS_WINDOW_LOCKED = false;

      /**
       * 依据锁定状态更新工具栏图标及鼠标交互提示。
       * 无参数。
       * @returns {void} 无返回值。
       */
      function renderToolBar() {
        if (IS_WINDOW_LOCKED) {
          document.getElementsByClassName("locked")[0].style.display = "block";
          document.getElementsByClassName("unlocked")[0].style.display = "none";
          document.querySelector("body").classList.remove("unlocked-body");
        } else {
          document.getElementsByClassName("locked")[0].style.display = "none";
          document.getElementsByClassName("unlocked")[0].style.display =
            "block";
          document.querySelector("body").classList.add("unlocked-body");
        }
      }

      // 进入歌词窗口区域时显示或隐藏锁定图标。
      document.getElementById("toolbar").style.display = "none";

      document.addEventListener("mouseenter",
        /**
         * 响应 "mouseenter" 事件，更新 document.getElementById("toolbar").style.display，执行 document.getElementById（"toolbar"）。
         * @param event 触发当前处理器的事件对象；当前函数体未使用，保留调用签名。
         * @returns {void} 无返回值。
         */
        (event) => {
        document.getElementById("toolbar").style.display = "block";
      });
      document.addEventListener("mouseleave",
        /**
         * 响应 "mouseleave" 事件，更新 document.getElementById("toolbar").style.display，执行 document.getElementById（"toolbar"）。
         * @param event 触发当前处理器的事件对象；当前函数体未使用，保留调用签名。
         * @returns {void} 无返回值。
         */
        (event) => {
        document.getElementById("toolbar").style.display = "none";
      });

      // 进入锁定图标区域时让窗口恢复接收鼠标事件。
      document
        .getElementById("lock-icon")
        .addEventListener("mouseenter",
          /**
           * 响应 "mouseenter" 事件，执行 window.api.send（"control"）。
           * @param event 触发当前处理器的事件对象；当前函数体未使用，保留调用签名。
           * @returns {void} 无返回值。
           */
          (event) => {
          if (!IS_WINDOW_LOCKED) {
            return;
          }
          const message = "float_window_accept_mouse_event";
          window.api.send("control", message);
        });

      document
        .getElementById("lock-icon")
        .addEventListener("mouseleave",
          /**
           * 响应 "mouseleave" 事件，执行 window.api.send（"control"）。
           * @param event 触发当前处理器的事件对象；当前函数体未使用，保留调用签名。
           * @returns {void} 无返回值。
           */
          (event) => {
          if (!IS_WINDOW_LOCKED) {
            return;
          }
          const message = "float_window_ignore_mouse_event";
          window.api.send("control", message);
        });

      Array.from(document.getElementsByClassName("window-action")).forEach(
        /**
         * 逐项处理 Array.from() 中的条目，执行 elem.addEventListener（"click"）。
         * @param elem 来自 Array.from() 的当前条目；使用 addEventListener 字段。
         * @returns {void} 无返回值。
         */
        (elem) => {
          elem.addEventListener(
            "click",
            /**
             * 响应 "click" 事件，更新 IS_WINDOW_LOCKED，执行 window.api.send（"control"）。
             * 无参数。
             * @returns {void} 无返回值。
             */
            function () {
              // 切换悬浮窗口的锁定状态。
              IS_WINDOW_LOCKED = !IS_WINDOW_LOCKED;
              renderToolBar();
              const message = IS_WINDOW_LOCKED
                ? "float_window_ignore_mouse_event"
                : "float_window_accept_mouse_event";
              window.api.send("control", message);
            },
            false
          );
        }
      );

      Array.from(document.getElementsByClassName("control-action")).forEach(
        /**
         * 逐项处理 Array.from() 中的条目，执行 elem.addEventListener（"click"）。
         * @param elem 来自 Array.from() 的当前条目；使用 addEventListener 字段。
         * @returns {void} 无返回值。
         */
        (elem) => {
          elem.addEventListener("click",
            /**
             * 响应 "click" 事件，执行 window.api.send（"control"）。
             * @param event 触发当前处理器的事件对象；使用 currentTarget 字段。
             * @returns {void} 无返回值。
             */
            (event) => {
            const message = event.currentTarget.dataset.msg;
            window.api.send("control", message);
          });
        }
      );
      // 拖动使用自定义处理；webkit-app-region 会影响鼠标进入事件。
      // 自定义拖动方案的背景说明见下方链接。
      // https://github.com/electron/electron/issues/1354#issuecomment-404348957
      /**
       * animationId：待执行拖动动画帧的标识，用于结束拖动时取消；类型为 number|null。
       * @type {number|null}
       */
      let animationId = null;
      /**
       * isDragging：是否正在执行自定义窗口拖动；类型为 boolean。
       * @type {boolean}
       */
      let isDragging = false;
      /**
       * mouseX：鼠标按下时距窗口左侧的偏移，单位为像素；类型为 number。
       * @type {number}
       */
      let mouseX = 0;
      /**
       * mouseY：鼠标按下时距窗口顶部的偏移，单位为像素；类型为 number。
       * @type {number}
       */
      let mouseY = 0;

      /**
       * 按下鼠标时记录指针在窗口内的偏移，启动逐帧拖动；锁定时跳过。
       * @param e 当前鼠标或窗口事件；使用 button、preventDefault、clientX、clientY 字段。
       * @returns {void} 无返回值。
       */
      function onMouseDown(e) {
        if (e.button !== 0) {
          return;
        }
        e.preventDefault();

        mouseX = e.clientX;
        mouseY = e.clientY;
        isDragging = true;

        document.addEventListener("mouseup", onMouseUp);
        window.addEventListener("blur", onMouseUp);
        moveWindow();
      }

      /**
       * 结束拖动并取消尚未执行的动画帧。
       * @param e 当前鼠标或窗口事件；当前函数体未使用，保留调用签名。
       * @returns {void} 无返回值。
       */
      function onMouseUp(e) {
        isDragging = false;
        document.removeEventListener("mouseup", onMouseUp);
        window.removeEventListener("blur", onMouseUp);
        if (animationId !== null) {
          cancelAnimationFrame(animationId);
          animationId = null;
        }
      }

      /**
       * 逐帧向主进程发送指针偏移，由主进程计算屏幕坐标并约束在工作区内。
       * 无参数。
       * @returns {void} 无返回值。
       */
      function moveWindow() {
        if (!isDragging) {
          return;
        }
        window.api.send("floatWindowMoving", {
          mouseX,
          mouseY,
        });
        animationId = requestAnimationFrame(moveWindow);
      }

      document
        .getElementById("currentLyricAll")
        .addEventListener("mousedown",
          /**
           * 响应 "mousedown" 事件，执行 onMouseDown。
           * @param event 触发当前处理器的事件对象。
           * @returns {void} 无返回值。
           */
          (event) => {
          onMouseDown(event);
        });

      renderToolBar();
    </script>
  </body>
</html>
